<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo Académico | PSM</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        body {
            margin: 0;
            padding: 20px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-blue);
            text-align: center;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--accent-blue);
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background: #0284c7;
            color: #fff;
        }

        #mensaje {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .exito { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro de Estudiantes</h2>
    <p class="subtitle">I.U.P. "Santiago Mariño" | Censo de estudiantes para Cátedras del prof. José Caldera</p>

    <form id="registroForm">
        <div class="form-group">
            <label for="materia">Asignatura / Cátedra:</label>
            <select id="materia" required>
                <option value="">Seleccione la materia que cursa...</option>
                <option value="Química General">Química I (General)</option>
                <option value="Química Orgánica I">Química Orgánica I</option>
                <option value="Química Orgánica II">Química Orgánica II</option>
            </select>
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos completos:</label>
            <input type="text" id="apellidos" required placeholder="Ej: Perez Rodriguez">
        </div>

        <div class="form-group">
            <label for="nombres">Nombres completos:</label>
            <input type="text" id="nombres" required placeholder="Ej: Juan Carlos">
        </div>

        <div class="form-group">
            <label for="cedula">Cédula de Identidad:</label>
            <input type="text" id="cedula" required placeholder="Ej: V-28123456">
        </div>

        <div class="form-group">
    <label for="carrera">Escuela / Carrera:</label>
    <select id="carrera" required>
        <option value="">Seleccione su carrera...</option>
        <option value="Ingeniería Civil">Ingeniería Civil</option>
        <option value="Ingeniería Eléctrica">Ingeniería Eléctrica</option>
        <option value="Ingeniería Química">Ingeniería Química</option>
        <option value="Ingeniería Industrial">Ingeniería Industrial</option>
        <option value="Ingeniería de Petróleo">Ingeniería de Petróleo</option>
        <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
        <option value="Ingeniería Electrónica">Ingeniería Electrónica</option>
        <option value="Ingeniería en Mantenimiento Mecánico">Ingeniería en Mantenimiento Mecánico</option>
        <option value="Otra">Otra</option>
    </select>
</div>

        <div class="form-group">
            <label for="seccion">Sección:</label>
            <input type="text" id="seccion" required placeholder="Ej: Sección A / Aula 05">
        </div>

        <button type="submit" id="btnEnviar">Registrarme</button>
    </form>

    <div id="mensaje"></div>
</div>

<script>
    // Coloca aquí la URL generada al implementar Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxwXL6ufNBMII-jpJsYGQXDzuDO4JENCH9xYVjzp4lrhkNqi0-BXkfY-Kj0colPegDIJg/exec";

    document.getElementById('registroForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnEnviar');
        const msg = document.getElementById('mensaje');
        
        btn.disabled = true;
        btn.innerText = "Registrando...";
        msg.style.display = "none";

        const payload = {
            materia: document.getElementById('materia').value,
            apellidos: document.getElementById('apellidos').value,
            nombres: document.getElementById('nombres').value,
            cedula: document.getElementById('cedula').value,
            carrera: document.getElementById('carrera').value,
            seccion: document.getElementById('seccion').value
        };

            fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
})
    });
</script>

</body>
</html>
