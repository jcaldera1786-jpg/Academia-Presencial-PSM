<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica: Límites Indeterminados (0/0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { transform: translateY(-1px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-md">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Práctica Guiada: 10 Ejercicios de Límites Indeterminados (\(\frac{0}{0}\))</h1>
            <p class="text-indigo-100 text-sm md:text-base">Aplica factorización y simplificación algebraica para romper la indeterminación antes de evaluar.</p>
            <div class="mt-4 flex items-center justify-between bg-indigo-700/50 p-3 rounded-xl text-sm">
                <span>Progreso: <strong id="score-indet">0</strong> / 10</span>
                <span>Aciertos: <strong id="correct-indet" class="text-emerald-300">0</strong></span>
            </div>
        </header>
        <div id="container-indet" class="space-y-6"></div>
        <footer class="text-center text-xs text-slate-400 py-6">Módulo de Indeterminaciones &bull; Apoyo Cognitivo Estructurado</footer>
    </div>

    <script>
        const exercisesIndet = [
            {
                id: 1,
                title: "Diferencia de cuadrados básica",
                statement: "\\lim_{x \\to 5} \\frac{x^2 - 25}{x - 5}",
                options: [
                    { text: "0", correct: false, feedback: "Incorrecto. Sustituir da 0/0, debe factorizar x^2 - 25 = (x-5)(x+5)." },
                    { text: "10", correct: true, feedback: "¡Excelente! Al cancelar (x-5), queda \\lim(x+5) = 5 + 5 = 10." },
                    { text: "5", correct: false, feedback: "Incorrecto. Recuerde sumar el valor al que tiende x tras simplificar." },
                    { text: "No existe", correct: false, feedback: "Incorrecto. El límite sí existe una vez removido el factor nulo." }
                ],
                steps: ["Sustitución directa produce 0/0.", "Factorizar numerador: (x-5)(x+5).", "Simplificar (x-5).", "Evaluar x+5 en 5 -> 5+5 = 10."]
            },
            {
                id: 2,
                title: "Trinomio cuadrado simple",
                statement: "\\lim_{x \\to 3} \\frac{x^2 - x - 6}{x - 3}",
                options: [
                    { text: "5", correct: true, feedback: "¡Muy bien! El numerador se factoriza como (x-3)(x+2). Al simplificar, queda 3 + 2 = 5." },
                    { text: "1", correct: false, feedback: "Incorrecto. Verifique los signos al factorizar el trinomio." },
                    { text: "0", correct: false, feedback: "Incorrecto. La indeterminación se rompe algebraicamente." },
                    { text: "6", correct: false, feedback: "Incorrecto. Revise la suma final." }
                ],
                steps: ["Sustitución genera 0/0.", "Factorizar: x^2 - x - 6 = (x-3)(x+2).", "Cancelar (x-3).", "Evaluar x + 2 para x = 3 -> 5."]
            },
            {
                id: 3,
                title: "Factor común simple",
                statement: "\\lim_{x \\to 0} \\frac{x^2 - 3x}{x}",
                options: [
                    { text: "-3", correct: true, feedback: "¡Correcto! Factor común x arriba: x(x - 3). Se cancela la x y queda 0 - 3 = -3." },
                    { text: "0", correct: false, feedback: "Incorrecto. Olvidó evaluar el término constante restante." },
                    { text: "3", correct: false, feedback: "Incorrecto. Cuidado con el signo negativo del 3." },
                    { text: "Indeterminado", correct: false, feedback: "Incorrecto. La indeterminación se elimina al simplificar la x." }
                ],
                steps: ["Sustitución da 0/0.", "Extraer factor común x: x(x - 3).", "Cancelar x con el denominador.", "Evaluar x - 3 en 0 -> -3."]
            },
            {
                id: 4,
                title: "Diferencia de cuadrados con x tendiendo a negativo",
                statement: "\\lim_{x \\to -2} \\frac{x^2 - 4}{x + 2}",
                options: [
                    { text: "-4", correct: true, feedback: "¡Excelente! (x-2)(x+2) / (x+2) = x - 2. Evaluando en -2: -2 - 2 = -4." },
                    { text: "4", correct: false, feedback: "Incorrecto. Cuidado con los signos negativos (-2 - 2)." },
                    { text: "0", correct: false, feedback: "Incorrecto. Revise la resta de números negativos." },
                    { text: "-2", correct: false, feedback: "Incorrecto. Verifique el resultado de la sustitución." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar: (x-2)(x+2).", "Simplificar (x+2).", "Evaluar x - 2 en -2 -> -4."]
            },
            {
                id: 5,
                title: "Trinomio con término independiente negativo",
                statement: "\\lim_{x \\to 4} \\frac{x^2 - 6x + 8}{x - 4}",
                options: [
                    { text: "2", correct: true, feedback: "¡Fantástico! El numerador se factoriza como (x-4)(x-2). Al cancelar, queda 4 - 2 = 2." },
                    { text: "-2", correct: false, feedback: "Incorrecto. Verifique el signo de la resta final." },
                    { text: "4", correct: false, feedback: "Incorrecto. Ese es el valor al que tiende x, no el límite." },
                    { text: "0", correct: false, feedback: "Incorrecto. Vuelva a comprobar la factorización." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar: (x-4)(x-2).", "Cancelar (x-4).", "Evaluar x - 2 en 4 -> 2."]
            },
            {
                id: 6,
                title: "Factor común y grado superior",
                statement: "\\lim_{x \\to 2} \\frac{x^3 - 8}{x - 2}",
                options: [
                    { text: "12", correct: true, feedback: "¡Muy bien! Diferencia de cubos: (x-2)(x^2 + 2x + 4). Evaluando en 2: 4 + 4 + 4 = 12." },
                    { text: "8", correct: false, feedback: "Incorrecto. Faltó evaluar los términos centrales del trinomio resultante." },
                    { text: "0", correct: false, feedback: "Incorrecto. La división ya no es cero tras simplificar." },
                    { text: "4", correct: false, feedback: "Incorrecto. Revise la suma de los tres términos." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar diferencia de cubos: (x-2)(x^2 + 2x + 4).", "Cancelar (x-2).", "Evaluar 2^2 + 2(2) + 4 = 12."]
            },
            {
                id: 7,
                title: "Trinomio cuadrático con x tendiendo a -1",
                statement: "\\lim_{x \\to -1} \\frac{x^2 + 3x + 2}{x + 1}",
                options: [
                    { text: "1", correct: true, feedback: "¡Correcto! Factorización: (x+1)(x+2). Al cancelar, queda -1 + 2 = 1." },
                    { text: "-1", correct: false, feedback: "Incorrecto. Verifique la suma algebraica -1 + 2." },
                    { text: "0", correct: false, feedback: "Incorrecto. Vuelva a evaluar el binomio resultante." },
                    { text: "2", correct: false, feedback: "Incorrecto. Revise los factores iniciales." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar: (x+1)(x+2).", "Cancelar (x+1).", "Evaluar x + 2 en -1 -> 1."]
            },
            {
                id: 8,
                title: "Simplificación con coeficiente en el denominador",
                statement: "\\lim_{x \\to 3} \\frac{x^2 - 9}{2x - 6}",
                options: [
                    { text: "3", correct: true, feedback: "¡Excelente! Numerador: (x-3)(x+3). Denominador: 2(x-3). Queda (x+3)/2 -> (3+3)/2 = 3." },
                    { text: "6", correct: false, feedback: "Incorrecto. Olvidó dividir entre el 2 del denominador." },
                    { text: "3/2", correct: false, feedback: "Incorrecto. Verifique la suma del numerador (3+3 = 6)." },
                    { text: "0", correct: false, feedback: "Incorrecto. Revise la simplificación." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar: \\frac{(x-3)(x+3)}{2(x-3)}.", "Cancelar (x-3).", "Evaluar \\frac{3+3}{2} = 3."]
            },
            {
                id: 9,
                title: "Trinomio con solución fraccionaria interna",
                statement: "\\lim_{x \\to -5} \\frac{x^2 + 7x + 10}{x + 5}",
                options: [
                    { text: "-3", correct: true, feedback: "¡Perfecto! Factorización: (x+5)(x+2). Al evaluar en -5: -5 + 2 = -3." },
                    { text: "3", correct: false, feedback: "Incorrecto. Cuidado con el signo del resultado final (-5 + 2)." },
                    { text: "0", correct: false, feedback: "Incorrecto. La operación resulta en un número negativo." },
                    { text: "-7", correct: false, feedback: "Incorrecto. Revise la sustitución final." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar: (x+5)(x+2).", "Cancelar (x+5).", "Evaluar x + 2 en -5 -> -3."]
            },
            {
                id: 10,
                title: "Factor común literal en ambos miembros",
                statement: "\\lim_{x \\to 1} \\frac{x^2 - x}{x^2 - 1}",
                options: [
                    { text: "1/2", correct: true, feedback: "¡Fantástico! Numerador: x(x-1). Denominador: (x-1)(x+1). Queda x/(x+1) -> 1/(1+1) = 1/2." },
                    { text: "1", correct: false, feedback: "Incorrecto. No olvide el denominador evaluado (1+1 = 2)." },
                    { text: "0", correct: false, feedback: "Incorrecto. Vuelva a simplificar la fracción." },
                    { text: "2", correct: false, feedback: "Incorrecto. El 2 queda en el denominador, no en el numerador." }
                ],
                steps: ["Sustitución da 0/0.", "Factorizar: \\frac{x(x-1)}{(x-1)(x+1)}.", "Cancelar (x-1).", "Evaluar \\frac{1}{1+1} = \\frac{1}{2}."]
            }
        ];

        let answeredIndet = 0, correctIndet = 0;
        function renderIndet() {
            const container = document.getElementById("container-indet");
            exercisesIndet.forEach(ex => {
                let card = document.createElement("div");
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100";
                let opts = "";
                ex.options.forEach((opt, idx) => {
                    opts += `<button onclick="checkIndet(${ex.id}, ${idx})" class="opt-indet-${ex.id} w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 text-slate-700 text-sm md:text-base mb-2"><span class="font-bold text-indigo-600 mr-2">${String.fromCharCode(65+idx)}.</span> \\(${opt.text}\\)</button>`;
                });
                card.innerHTML = `<div class="flex justify-between mb-3"><span class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs">Ejercicio ${ex.id}</span><h3 class="font-bold text-slate-800">${ex.title}</h3></div><div class="p-4 bg-indigo-50/50 rounded-xl text-center text-xl font-semibold text-indigo-900 mb-4">$${ex.statement}$</div><div class="space-y-2 mb-4">${opts}</div><div id="feedback-indet-${ex.id}" class="hidden mt-4 p-4 rounded-xl text-sm"></div>`;
                container.appendChild(card);
            });
            setTimeout(() => renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}] }), 50);
        }

        function checkIndet(id, optIdx) {
            let ex = exercisesIndet.find(e => e.id === id);
            let btns = document.querySelectorAll(`.opt-indet-${id}`);
            let fb = document.getElementById(`feedback-indet-${id}`);
            btns.forEach((b, i) => {
                b.disabled = true;
                if(ex.options[i].correct) b.className += " bg-emerald-100 border-emerald-400 font-bold text-emerald-900";
                else if(i === optIdx) b.className += " bg-rose-100 border-rose-400 text-rose-900";
                else b.style.opacity = "0.5";
            });
            let sel = ex.options[optIdx];
            if(sel.correct) {
                correctIndet++;
                fb.className = "mt-4 p-4 rounded-xl text-sm bg-emerald-50 border border-emerald-200 text-emerald-900";
                fb.innerHTML = `<div class="font-bold mb-1">✅ ¡Correcto!</div><p class="mb-2">${sel.feedback}</p><div class="text-xs bg-emerald-100/60 p-3 rounded-lg space-y-1"><strong>Pasos:</strong><br>${ex.steps.map(s => `• \\(${s}\\)<br>`).join('')}</div>`;
            } else {
                fb.className = "mt-4 p-4 rounded-xl text-sm bg-rose-50 border border-rose-200 text-rose-900";
                fb.innerHTML = `<div class="font-bold mb-1">❌ Incorrecto</div><p class="mb-2">${sel.feedback}</p><div class="text-xs bg-rose-100/60 p-3 rounded-lg space-y-1"><strong>Guía Paso a Paso:</strong><br>${ex.steps.map(s => `• \\(${s}\\)<br>`).join('')}</div>`;
            }
            fb.classList.remove("hidden");
            answeredIndet++;
            document.getElementById("score-indet").textContent = answeredIndet;
            document.getElementById("correct-indet").textContent = correctIndet;
            setTimeout(() => renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}] }), 50);
        }
        document.addEventListener("DOMContentLoaded", renderIndet);
    </script>
</body>
</html>
