<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica: Límites al Infinito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { transform: translateY(-1px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-md">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Práctica Guiada: 10 Ejercicios de Límites al Infinito (\(x \to \infty\))</h1>
            <p class="text-indigo-100 text-sm md:text-base">Divide cada término entre la mayor potencia de x para determinar el comportamiento límite.</p>
            <div class="mt-4 flex items-center justify-between bg-indigo-700/50 p-3 rounded-xl text-sm">
                <span>Progreso: <strong id="score-inf">0</strong> / 10</span>
                <span>Aciertos: <strong id="correct-inf" class="text-emerald-300">0</strong></span>
            </div>
        </header>
        <div id="container-inf" class="space-y-6"></div>
        <footer class="text-center text-xs text-slate-400 py-6">Módulo de Límites al Infinito &bull; Apoyo Cognitivo Estructurado</footer>
    </div>

    <script>
        const exercisesInf = [
            {
                id: 1,
                title: "Grados iguales (cuadráticos)",
                statement: "\\lim_{x \\to \\infty} \\frac{5x^2 - 3x}{2x^2 + 1}",
                options: [
                    { text: "5/2", correct: true, feedback: "¡Excelente! Al dividir entre x^2, los términos menores tienden a 0, quedando solo los coeficientes principales: 5/2." },
                    { text: "0", correct: false, feedback: "Incorrecto. Como el grado de x es igual arriba y abajo, el límite es el cociente de los coeficientes principales." },
                    { text: "3/2", correct: false, feedback: "Incorrecto. Verifique el coeficiente principal del numerador (es 5)." },
                    { text: "\\infty", correct: false, feedback: "Incorrecto. Los grados coinciden, por lo que no diverge a infinito." }
                ],
                steps: ["Mayor potencia: x^2.", "Dividir todo entre x^2.", "Términos con x en denominador se anulan (tienden a 0).", "Resultado: 5/2."]
            },
            {
                id: 2,
                title: "Grado mayor en el denominador",
                statement: "\\lim_{x \\to \\infty} \\frac{3x + 4}{x^2 - 5}",
                options: [
                    { text: "0", correct: true, feedback: "¡Muy bien! Como el denominador tiene mayor grado (x^2), la fracción se vuelve infinitamente pequeña (0)." },
                    { text: "3", correct: false, feedback: "Incorrecto. Eso aplicaría si los grados fueran iguales." },
                    { text: "\\infty", correct: false, feedback: "Incorrecto. Cuando el denominador crece más rápido, el límite tiende a cero." },
                    { text: "3/5", correct: false, feedback: "Incorrecto. Revise los grados de las potencias de x." }
                ],
                steps: ["Mayor potencia en denominador: x^2.", "Dividir todo entre x^2.", "Numerador tiende a 0, denominador a 1.", "Resultado: 0 / 1 = 0."]
            },
            {
                id: 3,
                title: "Grado mayor en el numerador",
                statement: "\\lim_{x \\to \\infty} \\frac{4x^3 - x}{2x^2 + 3}",
                options: [
                    { text: "\\infty", correct: true, feedback: "¡Correcto! El numerador crece mucho más rápido que el denominador, por lo que el límite diverge a infinito." },
                    { text: "0", correct: false, feedback: "Incorrecto. El grado mayor está arriba, no abajo." },
                    { text: "2", correct: false, feedback: "Incorrecto. Verifique los grados de las expresiones." },
                    { text: "4/2", correct: false, feedback: "Incorrecto. Eso solo aplica si los grados son iguales." }
                ],
                steps: ["Mayor potencia: x^3.", "Dividir entre x^3.", "Numerador queda con constante y denominador con x en el denominador.", "Resultado: Infinito (no existe finito)."]
            },
            {
                id: 4,
                title: "Lineales simples iguales",
                statement: "\\lim_{x \\to \\infty} \\frac{7x - 2}{3x + 5}",
                options: [
                    { text: "7/3", correct: true, feedback: "¡Excelente! Grados iguales (x^1), se toman directamente los coeficientes principales: 7/3." },
                    { text: "7/5", correct: false, feedback: "Incorrecto. El coeficiente de x en el denominador es 3." },
                    { text: "0", correct: false, feedback: "Incorrecto. Los grados son iguales, no mayor abajo." },
                    { text: "-2/5", correct: false, feedback: "Incorrecto. Esos son los términos independientes, no los principales." }
                ],
                steps: ["Mayor potencia: x.", "Dividir entre x.", "Términos con x abajo se anulan.", "Resultado: 7/3."]
            },
            {
                id: 5,
                title: "Constante sobre polinomio al infinito",
                statement: "\\lim_{x \\to \\infty} \\frac{15}{x^4 + 2}",
                options: [
                    { text: "0", correct: true, feedback: "¡Perfecto! Una constante fija dividida entre un número que crece infinitamente da como resultado 0." },
                    { text: "15", correct: false, feedback: "Incorrecto. El denominador crece sin límite, haciendo que la fracción se extinga a cero." },
                    { text: "\\infty", correct: false, feedback: "Incorrecto. El infinito está abajo, lo que anula la fracción." },
                    { text: "15/2", correct: false, feedback: "Incorrecto. La x está en el denominador afectando todo." }
                ],
                steps: ["Numerador es constante (15).", "Denominador tiende a infinito (x^4 + 2 -> \\infty).", "Constante / Infinito = 0."]
            },
            {
                id: 6,
                title: "Grados cuadráticos complejos",
                statement: "\\lim_{x \\to \\infty} \\frac{2x^2 + 6x - 1}{4x^2 - x + 3}",
                options: [
                    { text: "1/2", correct: true, feedback: "¡Muy bien! Simplificando coeficientes principales: 2/4 = 1/2." },
                    { text: "2", correct: false, feedback: "Incorrecto. Simplifique correctamente 2/4 a su mínima expresión." },
                    { text: "0", correct: false, feedback: "Incorrecto. Los grados del numerador y denominador son iguales (x^2)." },
                    { text: "-1/3", correct: false, feedback: "Incorrecto. Revise los coeficientes de los términos cuadráticos." }
                ],
                steps: ["Mayor potencia: x^2.", "Dividir entre x^2.", "Quedan los coeficientes principales: 2 / 4.", "Simplificar: 1/2."]
            },
            {
                id: 7,
                title: "Denominador con cubo y numerador lineal",
                statement: "\\lim_{x \\to \\infty} \\frac{9x + 1}{3x^3 - 2x}",
                options: [
                    { text: "0", correct: true, feedback: "¡Correcto! El denominador tiene mayor potencia (x^3), por lo que el cociente tiende a 0." },
                    { text: "3", correct: false, feedback: "Incorrecto. Verifique dónde está la potencia mayor." },
                    { text: "\\infty", correct: false, feedback: "Incorrecto. El crecimiento mayor ocurre en la parte inferior." },
                    { text: "-1/2", correct: false, feedback: "Incorrecto. El límite directo con x a infinito en este caso da cero." }
                ],
                steps: ["Mayor potencia: x^3.", "Dividir entre x^3.", "Numerador tiende a 0, denominador a 3.", "Resultado: 0 / 3 = 0."]
            },
            {
                id: 8,
                title: "Expresión polinómica cúbica igualada",
                statement: "\\lim_{x \\to \\infty} \\frac{6x^3 - 5x^2 + 4}{2x^3 + x - 7}",
                options: [
                    { text: "3", correct: true, feedback: "¡Fantástico! Coeficientes principales de x^3: 6 / 2 = 3." },
                    { text: "6", correct: false, feedback: "Incorrecto. No olvide dividir entre el coeficiente del denominador (2)." },
                    { text: "0", correct: false, feedback: "Incorrecto. Los grados son iguales (x^3)." },
                    { text: "-4/7", correct: false, feedback: "Incorrecto. Se usan los coeficientes de la potencia mayor." }
                ],
                steps: ["Mayor potencia: x^3.", "Tomar coeficientes principales: 6 y 2.", "Dividir: 6 / 2 = 3."]
            },
            {
                id: 9,
                title: "Numerador con término cúbico dominante",
                statement: "\\lim_{x \\to \\infty} \\frac{7x^3 + 2x}{5x^2 - 4}",
                options: [
                    { text: "\\infty", correct: true, feedback: "¡Excelente! El numerador es de mayor grado (3) que el denominador (2), por lo que diverge a infinito." },
                    { text: "7/5", correct: false, feedback: "Incorrecto. Los grados no son iguales, el numerador domina." },
                    { text: "0", correct: false, feedback: "Incorrecto. El grado mayor está arriba." },
                    { text: "-1/2", correct: false, feedback: "Incorrecto. Analice el orden de las potencias." }
                ],
                steps: ["Mayor potencia: x^3.", "Dividir entre x^3.", "Numerador sobrevive con constante, denominador queda con x abajo tendiendo a 0.", "Resultado: Infinito."]
            },
            {
                id: 10,
                title: "Límite al infinito con coeficientes negativos",
                statement: "\\lim_{x \\to \\infty} \\frac{-4x^2 + x}{8x^2 + 3}",
                options: [
                    { text: "-1/2", correct: true, feedback: "¡Perfecto! Cociente de coeficientes principales: -4 / 8 = -1/2." },
                    { text: "1/2", correct: false, feedback: "Incorrecto. Cuidado con el signo negativo del numerador (-4)." },
                    { text: "-4", correct: false, feedback: "Incorrecto. Debe dividir entre el coeficiente del denominador (8)." },
                    { text: "0", correct: false, feedback: "Incorrecto. Los grados cuadráticos son iguales." }
                ],
                steps: ["Mayor potencia: x^2.", "Tomar coeficientes: -4 y 8.", "Dividir: -4 / 8.", "Simplificar: -1/2."]
            }
        ];

        let answeredInf = 0, correctInf = 0;
        function renderInf() {
            const container = document.getElementById("container-inf");
            exercisesInf.forEach(ex => {
                let card = document.createElement("div");
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100";
                let opts = "";
                ex.options.forEach((opt, idx) => {
                    opts += `<button onclick="checkInf(${ex.id}, ${idx})" class="opt-inf-${ex.id} w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 text-slate-700 text-sm md:text-base mb-2"><span class="font-bold text-indigo-600 mr-2">${String.fromCharCode(65+idx)}.</span> \\(${opt.text}\\)</button>`;
                });
                card.innerHTML = `<div class="flex justify-between mb-3"><span class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs">Ejercicio ${ex.id}</span><h3 class="font-bold text-slate-800">${ex.title}</h3></div><div class="p-4 bg-indigo-50/50 rounded-xl text-center text-xl font-semibold text-indigo-900 mb-4">$${ex.statement}$</div><div class="space-y-2 mb-4">${opts}</div><div id="feedback-inf-${ex.id}" class="hidden mt-4 p-4 rounded-xl text-sm"></div>`;
                container.appendChild(card);
            });
            setTimeout(() => renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}] }), 50);
        }

        function checkInf(id, optIdx) {
            let ex = exercisesInf.find(e => e.id === id);
            let btns = document.querySelectorAll(`.opt-inf-${id}`);
            let fb = document.getElementById(`feedback-inf-${id}`);
            btns.forEach((b, i) => {
                b.disabled = true;
                if(ex.options[i].correct) b.className += " bg-emerald-100 border-emerald-400 font-bold text-emerald-900";
                else if(i === optIdx) b.className += " bg-rose-100 border-rose-400 text-rose-900";
                else b.style.opacity = "0.5";
            });
            let sel = ex.options[optIdx];
            if(sel.correct) {
                correctInf++;
                fb.className = "mt-4 p-4 rounded-xl text-sm bg-emerald-50 border border-emerald-200 text-emerald-900";
                fb.innerHTML = `<div class="font-bold mb-1">✅ ¡Correcto!</div><p class="mb-2">${sel.feedback}</p><div class="text-xs bg-emerald-100/60 p-3 rounded-lg space-y-1"><strong>Pasos:</strong><br>${ex.steps.map(s => `• \\(${s}\\)<br>`).join('')}</div>`;
            } else {
                fb.className = "mt-4 p-4 rounded-xl text-sm bg-rose-50 border border-rose-200 text-rose-900";
                fb.innerHTML = `<div class="font-bold mb-1">❌ Incorrecto</div><p class="mb-2">${sel.feedback}</p><div class="text-xs bg-rose-100/60 p-3 rounded-lg space-y-1"><strong>Guía Paso a Paso:</strong><br>${ex.steps.map(s => `• \\(${s}\\)<br>`).join('')}</div>`;
            }
            fb.classList.remove("hidden");
            answeredInf++;
            document.getElementById("score-inf").textContent = answeredInf;
            document.getElementById("correct-inf").textContent = correctInf;
            setTimeout(() => renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}] }), 50);
        }
        document.addEventListener("DOMContentLoaded", renderInf);
    </script>
</body>
</html>
