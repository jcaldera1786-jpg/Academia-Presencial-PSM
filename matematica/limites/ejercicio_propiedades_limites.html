<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Interactiva: Propiedades de los Límites</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS y JS para renderizado matemático profesional -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { transform: translateY(-1px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Cabecera -->
        <header class="bg-indigo-600 text-white p-6 rounded-2xl shadow-md">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">Práctica Guiada: 10 Ejercicios de Límites</h1>
            <p class="text-indigo-100 text-sm md:text-base">Selecciona una respuesta para ver la retroalimentación detallada paso a paso. Diseñado con claridad y apoyo cognitivo (Sin trigonometría).</p>
            <div class="mt-4 flex items-center justify-between bg-indigo-700/50 p-3 rounded-xl text-sm">
                <span>Progreso completado: <strong id="score-counter">0</strong> / 10</span>
                <span>Aciertos: <strong id="correct-counter" class="text-emerald-300">0</strong></span>
            </div>
        </header>

        <!-- Contenedor de Ejercicios -->
        <div id="exercises-container" class="space-y-6">
            <!-- Los ejercicios se inyectarán dinámicamente aquí mediante JavaScript -->
        </div>

        <footer class="text-center text-xs text-slate-400 py-6">
            Plataforma de Aprendizaje Adaptativo &bull; Soporte Cognitivo Estructurado
        </footer>

    </div>

    <script>
        // Base de datos de los 10 ejercicios
        const exercises = [
            {
                id: 1,
                title: "Ejercicio 1: Límite de un binomio lineal",
                statement: "\\lim_{x \\to 3} (2x + 5)",
                options: [
                    { text: "8", correct: false, feedback: "Incorrecto. Recuerda sustituir x por 3 y multiplicar primero: 2(3) = 6, luego sumar 5." },
                    { text: "11", correct: true, feedback: "¡Excelente! Aplicando propiedades: \\lim(2x) + \\lim(5) = 2(3) + 5 = 6 + 5 = 11." },
                    { text: "10", correct: false, feedback: "Incorrecto. Verifique la multiplicación de la constante 2 por el valor al que tiende x (3)." },
                    { text: "6", correct: false, feedback: "Incorrecto. Olvidó sumar el término constante independiente (+5)." }
                ],
                steps: [
                    "Paso 1: Separar en suma de límites: \\lim_{x \\to 3}(2x) + \\lim_{x \\to 3}(5)",
                    "Paso 2: Sacar la constante: 2 \\cdot \\lim_{x \\to 3}(x) + 5",
                    "Paso 3: Sustituir x = 3: 2(3) + 5 = 6 + 5 = 11"
                ]
            },
            {
                id: 2,
                title: "Ejercicio 2: Polinomio de segundo grado",
                statement: "\\lim_{x \\to -1} (4x^2 - 3x + 2)",
                options: [
                    { text: "1", correct: false, feedback: "Incorrecto. Cuidado con los signos negativos al elevar al cuadrado y multiplicar." },
                    { text: "5", correct: false, feedback: "Incorrecto. Revise la operación con el término lineal: -3(-1) = +3." },
                    { text: "9", correct: true, feedback: "¡Perfecto! 4(-1)^2 - 3(-1) + 2 = 4(1) + 3 + 2 = 9." },
                    { text: "-1", correct: false, feedback: "Incorrecto. Un número negativo al cuadrado siempre se vuelve positivo." }
                ],
                steps: [
                    "Paso 1: Aplicar propiedades de suma, resta y potencias en cada término.",
                    "Paso 2: Sustituir x = -1: 4(-1)^2 - 3(-1) + 2",
                    "Paso 3: Resolver potencias y signos: 4(1) + 3 + 2 = 4 + 3 + 2 = 9"
                ]
            },
            {
                id: 3,
                title: "Ejercicio 3: Polinomio cúbico",
                statement: "\\lim_{x \\to 2} (x^3 - 2x^2 + x - 1)",
                options: [
                    { text: "1", correct: true, feedback: "¡Muy bien! (2)^3 - 2(2)^2 + 2 - 1 = 8 - 2(4) + 2 - 1 = 8 - 8 + 2 - 1 = 1." },
                    { text: "3", correct: false, feedback: "Incorrecto. Verifique la resta final o la potencia de 2^3." },
                    { text: "0", correct: false, feedback: "Incorrecto. 8 - 8 da cero en los primeros términos, pero faltan los dos últimos (+2 - 1)." },
                    { text: "7", correct: false, feedback: "Incorrecto. Asegúrese de respetar el orden de las operaciones y los exponentes." }
                ],
                steps: [
                    "Paso 1: Evaluar cada término sustituyendo x = 2.",
                    "Paso 2: Calcular potencias: (2)^3 = 8 y (2)^2 = 4",
                    "Paso 3: Sustituir y operar: 8 - 2(4) + 2 - 1 = 8 - 8 + 2 - 1 = 1"
                ]
            },
            {
                id: 4,
                title: "Ejercicio 4: Propiedad del Cociente",
                statement: "\\lim_{x \\to 4} \\frac{3x - 2}{x + 1}",
                options: [
                    { text: "10", correct: false, feedback: "Incorrecto. Olvidó dividir entre el valor del denominador." },
                    { text: "2", correct: true, feedback: "¡Exacto! Numerador: 3(4)-2 = 10. Denominador: 4+1 = 5. Cociente: 10 / 5 = 2." },
                    { text: "5", correct: false, feedback: "Incorrecto. Ese valor corresponde únicamente al denominador." },
                    { text: "12", correct: false, feedback: "Incorrecto. Verifique las operaciones aritméticas del numerador." }
                ],
                steps: [
                    "Paso 1: Aplicar propiedad del cociente (límite arriba y abajo).",
                    "Paso 2: Numerador: 3(4) - 2 = 12 - 2 = 10",
                    "Paso 3: Denominador: 4 + 1 = 5",
                    "Paso 4: Dividir resultados: \\frac{10}{5} = 2"
                ]
            },
            {
                id: 5,
                title: "Ejercicio 5: Límite cuando x tiende a cero",
                statement: "\\lim_{x \\to 0} (5x^4 - 2x^3 + 7)",
                options: [
                    { text: "0", correct: false, feedback: "Incorrecto. Recuerde que el último término es una constante independiente (+7)." },
                    { text: "-7", correct: false, feedback: "Incorrecto. La constante es positiva (+7), no negativa." },
                    { text: "7", correct: true, feedback: "¡Correcto! Todos los términos con x se vuelven cero al evaluar x = 0, quedando solo la constante 7." },
                    { text: "3", correct: false, feedback: "Incorrecto. Revise el valor de la constante." }
                ],
                steps: [
                    "Paso 1: Sustituir x = 0 en la expresión polinómica.",
                    "Paso 2: 5(0)^4 - 2(0)^3 + 7 = 0 - 0 + 7",
                    "Paso 3: Resultado final: 7"
                ]
            },
            {
                id: 6,
                title: "Ejercicio 6: Propiedad de la Raíz",
                statement: "\\lim_{x \\to 5} \\sqrt{x^2 - 9}",
                options: [
                    { text: "16", correct: false, feedback: "Incorrecto. Ese es el valor dentro de la raíz (radicando), pero falta aplicar la raíz cuadrada." },
                    { text: "4", correct: true, feedback: "¡Excelente! Dentro de la raíz: 5^2 - 9 = 25 - 9 = 16. Luego \\sqrt{16} = 4." },
                    { text: "\\sqrt{34}", correct: false, feedback: "Incorrecto. Verifique si sumó en lugar de restar dentro del radical." },
                    { text: "2", correct: false, feedback: "Incorrecto. La raíz cuadrada de 16 no es 2." }
                ],
                steps: [
                    "Paso 1: Introducir el límite dentro de la raíz: \\sqrt{\\lim(x^2 - 9)}",
                    "Paso 2: Evaluar la potencia: 5^2 = 25",
                    "Paso 3: Restar: 25 - 9 = 16",
                    "Paso 4: Aplicar la raíz: \\sqrt{16} = 4"
                ]
            },
            {
                id: 7,
                title: "Ejercicio 7: Propiedad del Producto",
                statement: "\\lim_{x \\to 1} [ (2x + 1)(3x - 2) ]",
                options: [
                    { text: "3", correct: true, feedback: "¡Muy bien! Primer paréntesis: 2(1)+1 = 3. Segundo paréntesis: 3(1)-2 = 1. Producto: 3 \\times 1 = 3." },
                    { text: "6", correct: false, feedback: "Incorrecto. Multiplicó mal los factores evaluados." },
                    { text: "1", correct: false, feedback: "Incorrecto. Revise la evaluación del primer paréntesis." },
                    { text: "0", correct: false, feedback: "Incorrecto. Ninguno de los factores da cero al evaluar x = 1." }
                ],
                steps: [
                    "Paso 1: Aplicar la propiedad del producto: \\lim(2x+1) \\cdot \\lim(3x-2)",
                    "Paso 2: Evaluar primer factor: 2(1) + 1 = 3",
                    "Paso 3: Evaluar segundo factor: 3(1) - 2 = 1",
                    "Paso 4: Multiplicar ambos resultados: 3 \\cdot 1 = 3"
                ]
            },
            {
                id: 8,
                title: "Ejercicio 8: Potencias negativas y cubos",
                statement: "\\lim_{x \\to -2} (5x^3 + 2x)",
                options: [
                    { text: "-44", correct: true, feedback: "¡Perfecto! 5(-2)^3 + 2(-2) = 5(-8) - 4 = -40 - 4 = -44." },
                    { text: "-36", correct: false, feedback: "Incorrecto. Revise el cálculo de 5 por -8." },
                    { text: "44", correct: false, feedback: "Incorrecto. Cuidado con los signos negativos al cubo (-2)^3 = -8." },
                    { text: "-48", correct: false, feedback: "Incorrecto. Verifique la suma algebraica final." }
                ],
                steps: [
                    "Paso 1: Evaluar la potencia cúbica: (-2)^3 = -8",
                    "Paso 2: Multiplicar por 5: 5(-8) = -40",
                    "Paso 3: Evaluar el segundo término: 2(-2) = -4",
                    "Paso 4: Sumar resultados: -40 + (-4) = -44"
                ]
            },
            {
                id: 9,
                title: "Ejercicio 9: Raíz y Constantes",
                statement: "\\lim_{x \\to 3} \\sqrt{2x + 3}",
                options: [
                    { text: "9", correct: false, feedback: "Incorrecto. Ese valor es el radicando, recuerde extraer la raíz cuadrada." },
                    { text: "3", correct: true, feedback: "¡Excelente! \\sqrt{2(3) + 3} = \\sqrt{6 + 3} = \\sqrt{9} = 3." },
                    { text: "\\sqrt{9}", correct: false, feedback: "Correcto el razonamiento, pero puede simplificarse más (\\sqrt{9} = 3)." },
                    { text: "6", correct: false, feedback: "Incorrecto. Verifique las operaciones dentro de la raíz." }
                ],
                steps: [
                    "Paso 1: Introducir el límite bajo el radical.",
                    "Paso 2: Sustituir x = 3: \\sqrt{2(3) + 3} = \\sqrt{6 + 3}",
                    "Paso 3: Resolver la suma: \\sqrt{9}",
                    "Paso 4: Extraer la raíz: 3"
                ]
            },
            {
                id: 10,
                title: "Ejercicio 10: Cociente polinómico",
                statement: "\\lim_{x \\to 2} \\frac{x^2 + 3x}{x + 1}",
                options: [
                    { text: "\\frac{10}{3}", correct: true, feedback: "¡Fantástico! Numerador: (2)^2 + 3(2) = 4 + 6 = 10. Denominador: 2 + 1 = 3. Resultado: 10/3." },
                    { text: "3", correct: false, feedback: "Incorrecto. Revise la evaluación del numerador." },
                    { text: "10", correct: false, feedback: "Incorrecto. Olvidó dividir entre el denominador (3)." },
                    { text: "\\frac{7}{3}", correct: false, feedback: "Incorrecto. Verifique el término x^2 evaluado en 2." }
                ],
                steps: [
                    "Paso 1: Aplicar propiedad del cociente.",
                    "Paso 2: Numerador: (2)^2 + 3(2) = 4 + 6 = 10",
                    "Paso 3: Denominador: 2 + 1 = 3",
                    "Paso 4: Expresar el cociente final: \\frac{10}{3}"
                ]
            }
        ];

        let answeredCount = 0;
        let correctCount = 0;

        function renderExercises() {
            const container = document.getElementById("exercises-container");
            container.innerHTML = "";

            exercises.forEach((ex, index) => {
                const card = document.createElement("div");
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100 transition-all";
                card.id = `exercise-${ex.id}`;

                let optionsHtml = "";
                ex.options.forEach((opt, optIdx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${ex.id}, ${optIdx})" 
                            class="option-btn-${ex.id} w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700 font-medium text-sm md:text-base mb-2">
                            <span class="font-bold text-indigo-600 mr-2">${String.fromCharCode(65 + optIdx)}.</span> \\(${opt.text}\\)
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs">Ejercicio ${ex.id} de 10</span>
                        <h3 class="text-base font-bold text-slate-800">${ex.title}</h3>
                    </div>
                    <div class="p-4 bg-indigo-50/50 rounded-xl text-center text-xl font-semibold text-indigo-900 mb-4">
                        $$\\lim_{x \\to a} \\dots \\quad ${ex.statement}$$
                    </div>
                    <div class="space-y-2 mb-4">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-${ex.id}" class="hidden mt-4 p-4 rounded-xl text-sm md:text-base"></div>
                `;

                container.appendChild(card);
            });

            // Renderizar matemáticas con KaTeX en toda la página
            triggerKaTeX();
        }

        function checkAnswer(exId, selectedOptIdx) {
            const ex = exercises.find(e => e.id === exId);
            const buttons = document.querySelectorAll(`.option-btn-${exId}`);
            const feedbackDiv = document.getElementById(`feedback-${exId}`);

            // Deshabilitar botones de este ejercicio una vez respondido
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (ex.options[idx].correct) {
                    btn.classList.remove("bg-slate-50", "border-slate-200");
                    btn.classList.add("bg-emerald-100", "border-emerald-400", "text-emerald-900", "font-bold");
                } else if (idx === selectedOptIdx) {
                    btn.classList.remove("bg-slate-50", "border-slate-200");
                    btn.classList.add("bg-rose-100", "border-rose-400", "text-rose-900");
                } else {
                    btn.classList.add("opacity-50");
                }
            });

            const selectedOpt = ex.options[selectedOptIdx];
            if (selectedOpt.correct) {
                correctCount++;
                feedbackDiv.className = "mt-4 p-4 rounded-xl text-sm md:text-base bg-emerald-50 border border-emerald-200 text-emerald-900";
                feedbackDiv.innerHTML = `
                    <div class="font-bold mb-1 flex items-center">✅ ¡Respuesta Correcta!</div>
                    <p class="mb-2">${selectedOpt.feedback}</p>
                    <div class="text-xs text-emerald-800 bg-emerald-100/60 p-3 rounded-lg space-y-1">
                        <strong>Desglose Paso a Paso:</strong><br>
                        ${ex.steps.map(s => `• \\(${s}\\)<br>`).join('')}
                    </div>
                `;
            } else {
                feedbackDiv.className = "mt-4 p-4 rounded-xl text-sm md:text-base bg-rose-50 border border-rose-200 text-rose-900";
                feedbackDiv.innerHTML = `
                    <div class="font-bold mb-1 flex items-center">❌ Respuesta Incorrecta</div>
                    <p class="mb-2">${selectedOpt.feedback}</p>
                    <div class="text-xs text-rose-800 bg-rose-100/60 p-3 rounded-lg space-y-1">
                        <strong>Guía de Corrección (Paso a Paso):</strong><br>
                        ${ex.steps.map(s => `• \\(${s}\\)<br>`).join('')}
                    </div>
                `;
            }

            feedbackDiv.classList.remove("hidden");
            answeredCount++;
            
            // Actualizar contadores
            document.getElementById("score-counter").textContent = answeredCount;
            document.getElementById("correct-counter").textContent = correctCount;

            // Volver a renderizar KaTeX para el contenido dinámico inyectado
            triggerKaTeX();
        }

        function triggerKaTeX() {
            setTimeout(() => {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: "$$", right: "$$", display: true},
                        {left: "$", right: "$", display: false},
                        {left: "\\(", right: "\\)", display: false},
                        {left: "\\[", right: "\\]", display: true}
                    ],
                    throwOnError : false
                });
            }, 50);
        }

        // Inicializar al cargar la página
        document.addEventListener("DOMContentLoaded", renderExercises);
    </script>
</body>
</html>
